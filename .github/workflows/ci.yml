name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

      - name: Formatting
        run: make fmt-check

      - name: Documentation lint
        run: make lint-docs

      - name: Release configuration
        run: make validate-release

      - name: Test
        run: make test-short

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Build
        run: make build

      - name: Fuzz (short)
        run: go test ./internal/server/tunnels/ -run=^$ -fuzz=FuzzDecodeCursor -fuzztime=30s

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HATCHWAY_DOMAIN: hatchway.test
      POSTGRES_PASSWORD: test-password
      HATCHWAY_PLUGIN_SECRET: test_plugin_secret_0123456789abcdef
      HATCHWAY_FRPS_AUTH_TOKEN: test_frps_auth_token_0123456789abcd
      # The provider validates token shape while loading the Caddyfile. This
      # is a non-secret, syntactically valid 35-character legacy token.
      CLOUDFLARE_API_TOKEN: "00000000000000000000000000000000000"
    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose and shell configuration
        run: make validate-config

      - name: Build container images
        run: docker compose build hatchway-server frps caddy

      - name: Validate Caddy configuration
        run: >-
          docker compose run --rm --no-deps --entrypoint caddy caddy
          validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate frps configuration
        run: |
          docker compose run --rm --no-deps --entrypoint /bin/sh frps -ec '
            umask 077
            envsubst '"'"'${HATCHWAY_PLUGIN_SECRET} ${HATCHWAY_TUNNEL_DOMAIN} ${HATCHWAY_FRPS_AUTH_TOKEN}'"'"' \
              </etc/frp/frps.toml.tmpl >/tmp/frps.toml
            frps verify -c /tmp/frps.toml
          '

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hatchway_test
          POSTGRES_USER: hatchway
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Migration test
        run: go test ./internal/db/ -v -count=1
        env:
          HATCHWAY_TEST_DATABASE_URL: postgres://hatchway:test_password@localhost:5432/hatchway_test?sslmode=disable

      - name: Integration tests — server packages
        env:
          HATCHWAY_TEST_DATABASE_URL: postgres://hatchway:test_password@localhost:5432/hatchway_test?sslmode=disable
        # -p 1 forces packages to run sequentially. Server integration
        # fixtures clear shared tables at setup, which is safe in isolation
        # but races if packages share one Postgres concurrently.
        run: go test -count=1 -p 1 -timeout 300s ./internal/server/...

      - name: Run migrations
        env:
          DATABASE_URL: postgres://hatchway:test_password@localhost:5432/hatchway_test?sslmode=disable
        # --yes skips the interactive confirmation that --force triggers when
        # users already exist. The earlier Integration tests step leaves rows
        # behind, so init needs --force every time CI runs this step.
        run: go run ./cmd/hatchway server init --force --yes

      - name: Integration test — server startup
        env:
          HATCHWAY_SERVER: http://localhost:9000
        run: |
          set -euo pipefail
          DATABASE_URL=postgres://hatchway:test_password@localhost:5432/hatchway_test?sslmode=disable \
          HATCHWAY_PLUGIN_SECRET=test_plugin_secret_0123456789abcdef \
          HATCHWAY_FRPS_AUTH_TOKEN=test_frps_auth_token_0123456789abcd \
          HATCHWAY_FRPS_DOMAIN=frps.test.local \
          HATCHWAY_TUNNEL_DOMAIN=tunnel.test.local \
          go run ./cmd/hatchway server run &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true; wait "${SERVER_PID}" 2>/dev/null || true' EXIT

          # Poll /healthz instead of sleeping; bound the wait so we don't
          # hang the job if the server crashes on boot.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/healthz >/dev/null; then
              break
            fi
            if ! kill -0 "${SERVER_PID}" 2>/dev/null; then
              echo "server exited before healthz came up" >&2
              exit 1
            fi
            sleep 1
          done

          curl -sf http://localhost:9000/healthz
          curl -sf http://localhost:9000/readyz

          echo "Integration readiness checks passed"
