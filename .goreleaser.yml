# .goreleaser.yml — Hatchway release configuration
#
# Client bundles include frpc for tunnel creation.
# Server binary is standalone (frps runs as a separate container).
#
# Prerequisites:
#   1. Run scripts/download-frp.sh to populate .release/frp/
#   2. goreleaser release --snapshot (local) or goreleaser release (CI)

version: 2

builds:
  - id: hatchway
    main: ./cmd/hatchway
    binary: hatchway
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: client
    ids:
      - hatchway
    name_template: "hatchway_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_LICENSES
      - src: .release/frp/{{ .Os }}_{{ .Arch }}/frpc
        dst: .
        strip_parent: true
    wrap_in_directory: true

  - id: server
    ids:
      - hatchway
    name_template: "hatchway-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_LICENSES
    wrap_in_directory: true

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
